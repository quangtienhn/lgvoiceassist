name: Release

# Every push and pull request builds the .ipk and the Homebrew Channel manifest (kept as a
# workflow artifact). Pushing a tag vX.Y.Z also publishes both as a GitHub release, which is
# what the manifestUrl in webosbrew/apps-repo points at:
#   https://github.com/<owner>/<repo>/releases/latest/download/io.github.xrogers.lgtvassist.manifest.json
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Oldest webOS release the app claims to support; the compatibility report is limited to it.
  # Keep in step with requirements.webosRelease in the apps-repo package file.
  WEBOS_RELEASE: '>=5.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax and translation check
        run: |
          for f in app/*.js app/daemon/*.js app/daemon/lib/*.js app/services/*/service.js tools/*.js; do node --check "$f"; done
          node tools/check_i18n.js
          for f in app/daemon/*.sh; do sh -n "$f"; done
          python3 -c "import json,sys; [json.load(open(f)) for f in sys.argv[1:]]" app/appinfo.json app/services/*/*.json

      # Third-party sources and the webOS toolchain (~350 MB), at the versions pinned in native/build.sh
      - uses: actions/cache@v6
        with:
          path: native/.deps
          key: native-deps-${{ hashFiles('native/build.sh') }}

      - name: Build the wake word detector for the TV
        run: native/build.sh webos

      - name: Wake word detector against the reference implementation (this machine's build)
        run: |
          python3 -m venv "$RUNNER_TEMP/mwwvenv"
          "$RUNNER_TEMP/mwwvenv/bin/pip" install -q pymicro-wakeword==2.5.0 ai-edge-litert
          "$RUNNER_TEMP/mwwvenv/bin/python" tools/test_wakeword.py

      - name: Build IPK and manifest
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          # commit time as the archive timestamp: the same commit always gives the same .ipk
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python3 tools/build_ipk.py
          (cd dist && sha256sum *.ipk | tee SHA256SUMS)
          {
            echo '### Build'
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo '```json'
            cat dist/*.manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The same check webosbrew/apps-repo runs on a submission. It only reports here (the
      # tool and its firmware data are downloaded from a third party and must not be able
      # to block a release), except for a package that no TV would install.
      - name: Compatibility report (webosbrew-ipk-verify)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download --repo webosbrew/dev-toolbox-cli --dir "$RUNNER_TEMP/toolbox" \
                 --pattern 'webosbrew-toolbox-ipk-verify_*_amd64.deb' --pattern 'webosbrew-toolbox-fw-symbols_*_amd64.deb' \
             || ! sudo apt-get install -y "$RUNNER_TEMP"/toolbox/*.deb >/dev/null; then
            echo '::warning::webosbrew toolbox could not be installed; compatibility report skipped'
            exit 0
          fi
          code=0
          webosbrew-ipk-verify --format markdown --details --fw-releases "$WEBOS_RELEASE" dist/*.ipk > "$RUNNER_TEMP/compat.md" || code=$?
          { echo '### Compatibility'; cat "$RUNNER_TEMP/compat.md"; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/compat.md"
          case "$code" in
            0) ;;
            1) echo "::warning::webosbrew-ipk-verify reports an incompatibility for webOS $WEBOS_RELEASE (see the job summary)" ;;
            6) echo '::error::webosbrew-ipk-verify: the package is built in a way no TV will install'; exit 1 ;;
            *) echo "::warning::webosbrew-ipk-verify could not complete (exit $code)" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: lgtvassist-ipk
          path: |
            dist/*.ipk
            dist/*.manifest.json
            dist/SHA256SUMS
          if-no-files-found: error

  # The TV runs Node 8.12: check that everything that runs there parses and passes its tests on that version.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '8.12.0'
      - name: Syntax on Node 8
        run: |
          node --version
          for f in app/i18n.js app/daemon/*.js app/daemon/lib/*.js app/services/*/service.js; do node --check "$f"; done
      - name: Crypto and protocol tests on Node 8
        run: node tools/test_noise.js
      - name: Translation check on Node 8
        run: node tools/check_i18n.js

  # The real daemon (on Node 8) against the real Home Assistant client library. Does not block a release:
  # a new aioesphomeapi can break it from the outside.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '8.12.0'
      - uses: actions/cache@v6
        with:
          path: native/.deps
          key: native-deps-${{ hashFiles('native/build.sh') }}
      - name: Build the wake word detector for this machine (used by the voice test)
        run: native/build.sh host
      - name: Install the Home Assistant ESPHome client
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q aioesphomeapi cryptography
      - name: Interoperability (encryption, key errors, plaintext)
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import aioesphomeapi; print('aioesphomeapi', aioesphomeapi.__version__ if hasattr(aioesphomeapi, '__version__') else '')"
          "$RUNNER_TEMP/venv/bin/python" tools/test_interop.py
      - name: Voice audio, events, languages, wake word on the TV
        run: '"$RUNNER_TEMP/venv/bin/python" tools/test_voice.py'
      - name: Crypto against OpenSSL
        run: '"$RUNNER_TEMP/venv/bin/python" tools/test_crypto_diff.py'

  release:
    if: github.ref_type == 'tag'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lgtvassist-ipk
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "LG TV Assist $TAG" --generate-notes \
            dist/*.ipk dist/*.manifest.json dist/SHA256SUMS
