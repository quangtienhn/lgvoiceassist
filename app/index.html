<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LG TV Assist</title>
<style>
  :root { --bg:#0e1621; --card:#17212e; --line:#24324a; --txt:#e8eef6; --dim:#8fa3bd; --acc:#03a9f4; --ok:#4caf50; --bad:#ef5350; --warn:#ffb300; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family: "LG Smart UI", "Museo Sans", Arial, sans-serif; overflow:hidden; }
  .wrap { padding: 48px 96px; height:100%; display:flex; flex-direction:column; }
  /* Chromium 68 (webOS 5) has no flexbox gap: use margins */
  .wrap > * { margin-bottom:32px; flex-shrink:0; } .wrap > *:last-child { margin-bottom:0; }
  .grid { margin-bottom:40px; }
  #hint, #nospy { margin-top:0; margin-bottom:40px; }
  header { display:flex; align-items:center; }
  header img { margin-right:24px; }
  header img { width:72px; height:72px; }
  header h1 { font-size:52px; margin:0; font-weight:600; }
  header .ver { color:var(--dim); font-size:26px; margin-left:auto; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 30px; }
  .k { color:var(--dim); font-size:24px; margin-bottom:8px; }
  .v { font-size:34px; }
  .dot { display:inline-block; width:18px; height:18px; border-radius:50%; margin-right:12px; vertical-align:middle; background:var(--dim); }
  .ok .dot { background:var(--ok); } .bad .dot { background:var(--bad); } .warn .dot { background:var(--warn); }
  .hint { font-size:25px; color:var(--dim); line-height:1.4; }
  .hint b { color:var(--txt); }
  .last { font-size:28px; line-height:1.45; }
  .last > div { display:flex; }
  .last .who { color:var(--dim); flex:0 0 150px; }
  /* long replies (e.g. error dumps) must not push the layout: clamp, full text in the detail panel */
  .last .txt { flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; word-break:break-word; }
  #detail { position:fixed; left:96px; right:96px; top:80px; bottom:80px; background:#0a1018; border:3px solid var(--acc); border-radius:18px;
            padding:34px 40px; font-size:28px; line-height:1.5; overflow:hidden; z-index:10; }
  #detail .body { position:absolute; left:40px; right:40px; top:90px; bottom:80px; overflow:hidden; }
  #detail .inner { white-space:pre-wrap; word-break:break-word; }
  #detail.log { font-size:21px; line-height:1.35; }
  #detail.log .inner { font-family: monospace; color:#a9bdd6; }
  #detail.diag { font-size:24px; line-height:1.4; }
  #detail.diag .inner { white-space:normal; }
  .dg { margin-bottom:8px; padding-left:30px; text-indent:-30px; }
  .dg .dot { width:16px; height:16px; margin-right:14px; }
  .dg.head { font-weight:600; margin-bottom:14px; padding-left:0; text-indent:0; }
  .dg.sub { color:var(--dim); margin-top:16px; padding-left:0; text-indent:0; }
  .dg.mono { font-family:monospace; font-size:19px; color:#a9bdd6; margin-bottom:2px; padding-left:0; text-indent:0; word-break:break-all; }
  .dg.dim { color:var(--dim); }
  .dg.note { color:var(--dim); margin-top:16px; padding-left:0; text-indent:0; }
  #detail h2 { margin:0 0 18px; font-size:34px; }
  #detail .foot { position:absolute; left:40px; bottom:26px; font-size:22px; color:var(--dim); }
  .hint, .nospy { max-height:150px; overflow:hidden; }
  .buttons { display:flex; flex-wrap:wrap; margin-bottom:16px !important; }
  .buttons .btn { margin:0 36px 20px 0; }
  .btn { font-size:30px; padding:18px 34px; border-radius:14px; background:var(--card); color:var(--txt); border:3px solid var(--line); }
  .btn.focus { border-color:var(--acc); background:#1d3550; transform:scale(1.04); }
  .btn.hidden { display:none; }
  pre { margin:0; flex:1 1 auto; flex-shrink:1; min-height:0; overflow:hidden; background:#0a1018; border:1px solid var(--line); border-radius:14px; padding:18px 22px; font-size:20px; color:#a9bdd6; white-space:pre-wrap; }
  .msg { font-size:26px; color:var(--warn); min-height:34px; }
  .nospy { border-color:var(--warn); color:var(--txt); }
  .nospy b { color:var(--warn); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <img src="icon.png" alt="">
    <h1>LG TV Assist</h1>
    <span class="ver" id="ver"></span>
  </header>

  <div class="grid">
    <div class="card" id="c-service"><div class="k" data-i18n="card_service"></div><div class="v"><span class="dot"></span><span id="service">…</span></div></div>
    <div class="card" id="c-ha"><div class="k">Home Assistant</div><div class="v"><span class="dot"></span><span id="ha">…</span></div></div>
    <div class="card"><div class="k" data-i18n="card_addr"></div><div class="v" id="addr">…</div>
      <div class="k" style="margin-top:14px" data-i18n="card_usb"></div><div class="v" id="usb" style="font-size:28px">…</div></div>
    <div class="card"><div class="k" data-i18n="card_last"></div>
      <div class="last"><div><span class="who" data-i18n="you"></span><span class="txt" id="lastText">—</span></div><div><span class="who" data-i18n="assistant"></span><span class="txt" id="lastReply">—</span></div></div>
    </div>
  </div>

  <div class="card hint nospy hidden" id="nospy"></div>
  <div class="card hint" id="hint"></div>

  <div class="buttons" id="buttons">
    <div class="btn" id="b-elevate" data-act="elevate" data-i18n="btn_elevate"></div>
    <div class="btn hidden" id="b-nospy" data-act="nospy" data-i18n="btn_nospy"></div>
    <div class="btn" id="b-toggle" data-act="toggle"></div>
    <div class="btn" id="b-restart" data-act="restart" data-i18n="btn_restart"></div>
    <div class="btn" id="b-hands" data-act="hands"></div>
    <div class="btn" id="b-wake" data-act="wake"></div>
    <div class="btn" id="b-wscreen" data-act="wscreen"></div>
    <div class="btn" id="b-toasts" data-act="toasts"></div>
    <div class="btn" id="b-enc" data-act="enc"></div>
    <div class="btn" id="b-detail" data-act="detail" data-i18n="btn_detail"></div>
    <div class="btn" id="b-log" data-act="log" data-i18n="btn_log"></div>
    <div class="btn" id="b-diag" data-act="diag" data-i18n="btn_diag"></div>
    <div class="btn" id="b-lang" data-act="lang"></div>
  </div>
  <div class="msg" id="msg"></div>
</div>
<div id="detail" class="hidden"><h2 id="detailTitle"></h2><div class="body"><div class="inner" id="detailText"></div></div>
  <div class="foot" id="detailFoot"></div></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
